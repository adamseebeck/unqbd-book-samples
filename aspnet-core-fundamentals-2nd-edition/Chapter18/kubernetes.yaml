apiVersion: apps/v1
kind: Deployment
metadata:
    name: adventureworks
spec:
    replicas: 1
    selector:
        matchLabels:
            app: adventureworks
    template:
        metadata:
            labels:
                app: adventureworks
        spec:
            terminationGracePeriodSeconds: 20
            containers:
                - name: api
                  image: adventureworks:local
                  ports:
                      - containerPort: 8080
                  resources:
                      requests:
                          cpu: 100m
                          memory: 64Mi
                      limits:
                          memory: 256Mi
                  livenessProbe:
                      httpGet:
                          path: /healthz/live
                          port: 8080
                  readinessProbe:
                      httpGet:
                          path: /healthz/ready
                          port: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: adventureworks
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: adventureworks
    minReplicas: 1
    maxReplicas: 2
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70
